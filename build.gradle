plugins {
    id 'java'

    //spring
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.5'

    // checkstyle
    id 'checkstyle'
}

group = 'com.moida'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

ext {
    mybatis_version = '3.6.1'
    mybatis_spring_boot_version = '3.0.3'
    mysql_version = '8.0.25'
    jasypt_version = '3.0.4'
    swagger_version = '3.0.0'
    jwt_version = '0.11.5'
}

dependencies {

    // Spring
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter"

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Mybatis
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatis_spring_boot_version}"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    // MySql
    runtimeOnly "mysql:mysql-connector-java:$mysql_version"

    // H2 Database for testing
    runtimeOnly 'com.h2database:h2'

    // Test
    testImplementation "org.springframework.boot:spring-boot-starter-test"

    //Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
    implementation "org.springdoc:springdoc-openapi-starter-common:2.0.2"

    // AOP
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Jasypt
    implementation "com.github.ulisesbocchio:jasypt-spring-boot-starter:$jasypt_version"

    //JWT
    implementation "io.jsonwebtoken:jjwt-api:$jwt_version"
    implementation "io.jsonwebtoken:jjwt-impl:$jwt_version"
    implementation "io.jsonwebtoken:jjwt-jackson:$jwt_version"
}

tasks.named('test') {
    useJUnitPlatform()
}

checkstyle {
    maxWarnings = 0
    configFile = file("${rootDir}/naver-checkstyle-rules.xml")
    configProperties = ["suppressionFile": "${rootDir}/naver-checkstyle-suppressions.xml"]
    toolVersion = "10.4"
}
