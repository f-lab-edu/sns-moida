version: "3.8"
services:
  mysql:
    image: mysql:8.0.32
    cap_add:
      - SYS_NICE
    container_name: sns-moida-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Ehdaud1597!
      MYSQL_DATABASE: moida
      MYSQL_USER: admin
      MYSQL_PASSWORD: Ehdaud1597!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/2-data.sql
    networks:
      - sns-moida-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sns-moida-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/moida
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: Ehdaud1597!
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sns-moida-network

volumes:
  mysql_data:

networks:
  sns-moida-network:
    driver: bridge
